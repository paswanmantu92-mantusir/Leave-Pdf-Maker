plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mantusir.leavepdf'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mantusir.leavepdf'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
}
